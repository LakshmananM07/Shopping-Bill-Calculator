name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
    # 1. Source Code & Version Control Stage
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Continuous Integration Stage (Test)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    # 3. Build & Push Stage (Docker Hub)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          lakshmanan007/shopping-calc:${{ github.sha }}
          lakshmanan007/shopping-calc:latest

    # 4. Local Deployment Stage simulation (Validates manifest)
    - name: Validate Kubernetes Manifests
      run: |
        kubectl credential-plugin version || true
        cat k8s/deployment.yml | sed "s|lakshmanan007/shopping-calc:latest|lakshmanan007/shopping-calc:${{ github.sha }}|g" > k8s/patched-deployment.yml
